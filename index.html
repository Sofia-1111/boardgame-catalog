<!DOCTYPE html>

<head>

    <title>Каталог настільних ігор (SPA + Hash Router)</title>
    <!-- Підключення шрифтів Comfortaa та Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Підключення Vue 3 через CDN із підтримкою DevTools -->

    <script>
      window.__VUE_DEVTOOLS_GLOBAL_HOOK__ && window.__VUE_DEVTOOLS_GLOBAL_HOOK__.Vue;

            </ul>
        </nav>
    </header>

    <!-- Головний контейнер SPA-застосунку для динамічного рендеру сторінок роутера -->
    <main id="app">
        <!-- Увесь вміст сторінок (#/, #/owned, #/games/:id, #/add, 404) керується шаблоном у script.js -->
    </main>
    
    <footer>
