<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог настільних ігор</title>
    <!-- Підключення шрифтів Comfortaa (заголовки) та Inter (основний текст) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>Каталог настільних ігор</h1>
        <nav>
            <ul>
                <li><a href="#strategy">Стратегії</a></li>
                <li><a href="#party">Для вечірок</a></li>
                <li><a href="#family">Сімейні</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section id="filters">
            <h2>Фільтри каталогу</h2>
            <form action="#" method="get" class="filters-form">
                <div class="form-group">
                    <label for="category-select">Категорія:</label>
                    <select id="category-select" name="category">
                        <option value="all">Всі категорії</option>
                        <option value="strategy">Стратегії</option>
                        <option value="party">Для вечірок</option>
                        <option value="family">Сімейні</option>
                    </select>
                </div>
                
                <!-- Оновлено на select для обробки події change за Варіантом №4 -->
                <div class="form-group">
                    <label for="filter-players-select">Кількість гравців:</label>
                    <select id="filter-players-select" name="players">
                        <option value="all">Усі варіанти</option>
                        <option value="2">Для 2 гравців</option>
                        <option value="3">Для 3 гравців</option>
                        <option value="4">Для 4 гравців</option>
                        <option value="5">Для 5 гравців</option>
                        <option value="6">Для 6+ гравців</option>
                        <option value="8">Для 8 гравців</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="search-input">Пошук гри:</label>
                    <input type="search" id="search-input" name="query" placeholder="Назва гри...">
                </div>

                <button type="submit" class="submit-btn">Застосувати фільтри</button>
            </form>
        </section>

        <!-- Секція форми додавання нової гри (ЛР8) -->
        <section id="add-game-section">
            <h2>Додати нову настільну гру</h2>
            <form id="add-game-form" class="filters-form" novalidate>
                <div class="form-group">
                    <label for="game-title">Назва гри:</label>
                    <input type="text" id="game-title" name="title" placeholder="Наприклад, Еволюція" required>
                </div>

                <div class="form-group">
                    <label for="game-min-players">Мін. кількість гравців:</label>
                    <input type="number" id="game-min-players" name="minPlayers" min="1" max="20" placeholder="2" required>
                </div>

                <div class="form-group">
                    <label for="game-max-players">Макс. кількість гравців:</label>
                    <input type="number" id="game-max-players" name="maxPlayers" min="1" max="20" placeholder="4" required>
                </div>

                <div class="form-group">
                    <label for="game-genre">Жанр гри:</label>
                    <select id="game-genre" name="genre" required>
                        <option value="">Оберіть жанр</option>
                        <option value="strategy">Стратегія</option>
                        <option value="party">Для вечірок</option>
                        <option value="family">Сімейні</option>
                        <option value="adventure">Пригоди</option>
                    </select>
                </div>

                <!-- Текстовий блок для виведення помилки валідації -->
                <p id="form-error" class="form-error" style="color: #c92a2a; margin-top: 8px; font-weight: 500; display: none;"></p>

                <button type="submit" class="submit-btn">Додати гру до каталогу</button>
            </form>
        </section>

        <section id="games">
            <div class="section-header" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 12px;">
                <h2>Популярні ігри (API)</h2>
                <!-- ЛР9 (Крок 10): Кнопка повторного завантаження даних -->
                <button id="reload-btn" class="submit-btn" style="padding: 8px 16px; width: auto;">🔄 Оновити з API</button>
            </div>

            <!-- ЛР9 (Крок 7): Індикатор завантаження -->
            <p id="loading-status" style="display: none; color: #2b6cb0; font-weight: 600;">⏳ Завантаження даних із сервера...</p>

            <!-- ЛР9 (Крок 8): Повідомлення про помилку -->
            <p id="api-error" style="display: none; color: #c92a2a; font-weight: 600; padding: 10px; background: #ffe3e3; border-radius: 8px; margin-bottom: 12px;"></p>

            <p id="games-count">Завантаження каталогу...</p>

            <div id="games-list" class="cards">
                <!-- Картки будуть згенеровані динамічно через script.js -->
            </div>
        </section>

    </main>
    
    <footer>
        <p>&copy; 2026 Каталог настільних ігор. Автор: Шаповал Софія, ІП-54.</p>
    </footer>
  
</body>
</html>
